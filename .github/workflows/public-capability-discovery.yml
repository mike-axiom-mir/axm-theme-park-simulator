name: Public capability discovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  generated-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - name: Checkout Theme Park
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify generated registry is current
        run: node tools/generate-public-capability.mjs --check
      - name: Run focused discovery regressions
        run: node --test intake-tests/public-capability-discovery.test.js
      - name: Verify real package descriptor
        run: |
          node runtime/cli.js describe > /tmp/theme-park-describe.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const document = JSON.parse(fs.readFileSync("/tmp/theme-park-describe.json", "utf8"));
          const capability = document.capability;
          if (document.command !== "describe") throw new Error("unexpected command receipt");
          if (capability?.id !== "axm.theme-park.headless-simulator") throw new Error("capability id drift");
          if (capability?.status !== "WORKING") throw new Error("status drift");
          if (capability?.runtime?.networkRequired !== false) throw new Error("offline boundary drift");
          if (capability?.authority?.canonical !== false) throw new Error("canonical authority drift");
          if (capability?.authority?.cliWritesNewFilesOnly !== true) throw new Error("write boundary drift");
          NODE
      - name: Preserve the complete headless regression gate
        run: npm run test:headless

  discovery-buddy-bridge:
    runs-on: ubuntu-latest
    needs: generated-contract
    steps:
      - name: Checkout Theme Park
        uses: actions/checkout@v4
      - name: Checkout pinned Discovery Buddy consumer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-discovery-buddy
          ref: 1a94fc2481d1cfc9234dea7c86af4777126d3924
          path: .ci/discovery-buddy
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and exact-verify public discovery index
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/discovery-buddy
        run: |
          python -m discovery_buddy scan . --public --output-dir /tmp/theme-park-discovery
          python -m discovery_buddy verify . --public --output-dir /tmp/theme-park-discovery
      - name: Prove the real bridge and public-safe boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          index = json.loads(Path("/tmp/theme-park-discovery/public-discovery.json").read_text("utf-8"))
          assert index["schema"] == "axm.discovery-index/v0.1"
          assert index["visibility"] == "PUBLIC_SAFE_DECLARED_ONLY"
          assert index["summary"]["repositories"] == 1
          assert index["summary"]["capability_records"] == 1
          repo = index["repositories"][0]
          assert repo["repo"] == "mike-axiom-mir/axm-theme-park-simulator"
          assert "path" not in repo and "git" not in repo
          records = repo["capabilities"]["records"]
          assert len(records) == 1
          record = records[0]
          assert record["id"] == "axm.theme-park.headless-simulator"
          assert record["status"] == "WORKING"
          assert record["providers"] == ["mike-axiom-mir/axm-theme-park-simulator"]
          assert record["consumers"] == []
          assert record["source"] == "registry/capabilities.jsonl"
          assert record["line"] == 1
          sources = repo["capabilities"]["sources"]
          assert len(sources) == 1
          assert sources[0]["records"] == 1
          assert sources[0]["errors"] == 0
          raw = Path("registry/capabilities.jsonl").read_bytes()
          assert sources[0]["sha256"] == hashlib.sha256(raw).hexdigest()
          print("Theme Park -> Discovery Buddy bridge: PASS")
          PY
