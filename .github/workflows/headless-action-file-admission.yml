name: Headless action-file admission

on:
  pull_request:
    paths:
      - "runtime/cli.js"
      - "runtime/action-file-reader.js"
      - "truth-tests/action-file-admission.test.js"
      - ".github/workflows/headless-action-file-admission.yml"
      - "HEADLESS_CONSUMER.md"
  push:
    branches:
      - "automation/truth-sentinel-action-file-admission-20260910"

permissions:
  contents: read

concurrency:
  group: headless-action-file-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check CLI syntax
        run: node --check runtime/cli.js

      - name: Run inherited headless/package tests
        run: npm run test:headless

      - name: Run action-file admission regressions
        run: node --test truth-tests/action-file-admission.test.js
