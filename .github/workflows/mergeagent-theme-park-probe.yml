name: MergeAgent Theme Park Steward seal

on:
  push:
    branches:
      - integration/theme-park-growth-consolidation-20260912

permissions:
  contents: write

concurrency:
  group: mergeagent-theme-park-steward-seal
  cancel-in-progress: true

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/theme-park-growth-consolidation-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Merge Steward into current safety body
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff c33edbb476840ed1bdbdeed9c13c7812e3dafcf7
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            [ "$conflicts" = 'playable_3d/src/core/save.js' ] || { printf '%s\n' "$conflicts"; exit 1; }
            git checkout --ours playable_3d/src/core/save.js
          fi
          python .axm-integration/steward_reconcile.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          staff = Path('playable_3d/tests/staff-management.test.js')
          text = staff.read_text()
          old_decl = '  const staffRenderer = read("../src/render/staffAwareWorldRenderer.js");\n'
          new_decl = old_decl + '  const specialRenderer = read("../src/render/specialContentWorldRenderer.js");\n'
          if new_decl not in text:
              text = replace_once(text, old_decl, new_decl, 'staff renderer declaration')
          text = replace_once(text,
              '  assert.match(main, /staffAwareWorldRenderer/);\n',
              '  assert.match(main, /contentStudioWorldRenderer/);\n  assert.match(specialRenderer, /staffAwareWorldRenderer/);\n',
              'staff renderer assertion')
          staff.write_text(text)

          style = Path('playable_3d/tests/style-superpowers.test.js')
          text = style.read_text()
          old_decl = '  const finalStyle = read("../src/render/finalStyleWorldRenderer.js");\n'
          new_decl = old_decl + '  const legacyStyle = read("../src/render/legacyStyleUpgradeWorldRenderer.js");\n'
          if new_decl not in text:
              text = replace_once(text, old_decl, new_decl, 'style superpower legacy seam declaration')
          text = replace_once(text,
              '  assert.match(finalStyle, /gildedStyleWorldRenderer/);\n',
              '  assert.match(finalStyle, /legacyStyleUpgradeWorldRenderer/);\n  assert.match(legacyStyle, /gildedStyleWorldRenderer/);\n',
              'style superpower final seam assertion')
          style.write_text(text)

          water = Path('playable_3d/tests/theme-fit-water-content.test.js')
          text = water.read_text()
          old_decl = '  const finalStyle = read("../src/render/finalStyleWorldRenderer.js");\n'
          new_decl = old_decl + '  const legacyStyle = read("../src/render/legacyStyleUpgradeWorldRenderer.js");\n  const gildedStyle = read("../src/render/gildedStyleWorldRenderer.js");\n  const festivalStyle = read("../src/render/festivalTechStyleWorldRenderer.js");\n'
          if new_decl not in text:
              text = replace_once(text, old_decl, new_decl, 'water final style chain declaration')
          text = replace_once(text,
              '  assert.match(finalStyle, /medievalStyleWorldRenderer/);\n',
              '  assert.match(finalStyle, /legacyStyleUpgradeWorldRenderer/);\n  assert.match(legacyStyle, /gildedStyleWorldRenderer/);\n  assert.match(gildedStyle, /FestivalTechMotionGuardWorldRenderer/);\n  assert.match(festivalStyle, /MedievalStyleWorldRenderer/);\n',
              'water final style chain assertion')
          water.write_text(text)

          upgrades = Path('playable_3d/tests/upgrades.test.js')
          text = upgrades.read_text()
          runtime_decl = '  const upgradeRuntime = read("../src/core/upgradeRuntime.js");\n'
          chain_decl = runtime_decl + '  const historicalRuntime = read("../src/core/historicalEconomyRuntime.js");\n  const legacyRuntime = read("../src/core/legacyCareerRuntime.js");\n'
          if chain_decl not in text:
              text = replace_once(text, runtime_decl, chain_decl, 'upgrade runtime chain declarations')
          text = replace_once(text,
              '  assert.match(main, /advanceOneMinuteWithUpgrades/);\n',
              '  assert.match(main, /advanceOneMinuteWithLegacyCareer/);\n  assert.match(legacyRuntime, /advanceOneMinuteWithHistoricalEconomy/);\n  assert.match(historicalRuntime, /advanceOneMinuteWithUpgrades/);\n',
              'upgrade runtime chain assertion')
          upgrades.write_text(text)

          historical_styles = Path('playable_3d/tests/western-medieval-styles.test.js')
          text = historical_styles.read_text()
          old_decl = '  const finalStyle = read("../src/render/finalStyleWorldRenderer.js");\n'
          new_decl = old_decl + '  const legacyStyle = read("../src/render/legacyStyleUpgradeWorldRenderer.js");\n'
          if new_decl not in text:
              text = replace_once(text, old_decl, new_decl, 'western medieval legacy seam declaration')
          text = replace_once(text,
              '  assert.match(finalStyle, /gildedStyleWorldRenderer/);\n',
              '  assert.match(finalStyle, /legacyStyleUpgradeWorldRenderer/);\n  assert.match(legacyStyle, /gildedStyleWorldRenderer/);\n',
              'western medieval final seam assertion')
          historical_styles.write_text(text)
          PY
          git add -A

      - name: Rebuild current generated surfaces
        run: |
          set -euo pipefail
          npm run build:playable
          node tools/generate-public-capability.mjs
          git add -A

      - name: Regenerate intake provenance without rewriting archive indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          source_path = root / '.axm-intake' / 'SOURCE_ARCHIVES.json'
          local_path = root / '.axm-intake' / 'LOCAL_PATCHES.json'
          source = json.loads(source_path.read_text('utf-8'))
          active = source['lineages']['active']
          tracked = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', *active['topLevelEntries']],
              text=True,
          ).split('\0')
          active['sourceFiles'] = len([item for item in tracked if item])
          source_path.write_text(json.dumps(source, indent=2) + '\n', encoding='utf-8')

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          patches = []
          for index_name in ('CHECKSUMS.sha256', 'PLAYABLE_3D_V0_4_6_CHECKSUMS.sha256'):
              for raw in (root / index_name).read_text('utf-8').splitlines():
                  if not raw.strip():
                      continue
                  original, relative = raw.split(None, 1)
                  relative = relative.strip().replace('\\', '/')
                  target = root / relative
                  if not target.is_file():
                      continue
                  current = sha256(target)
                  original = original.lower()
                  if current == original:
                      continue
                  patches.append({
                      'index': index_name,
                      'path': relative,
                      'originalSha256': original,
                      'currentSha256': current,
                      'reason': 'Verified cumulative local active-lineage integration differs from the preserved archive byte while the original checksum index remains immutable.'
                  })

          manifest = {
              'schema': 'axm.theme-park-local-patches/v1',
              'status': 'TEST',
              'archiveChecksumIndexesModified': False,
              'patches': patches,
          }
          local_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(f"active tracked source files: {active['sourceFiles']}")
          print(f"declared checksum divergences: {len(patches)}")
          PY
          git add .axm-intake/SOURCE_ARCHIVES.json .axm-intake/LOCAL_PATCHES.json

      - name: Prove canonical event authority is singular
        shell: bash
        run: |
          set -euo pipefail
          writers="$(grep -R -n -F 'eventLog.push' playable_3d/src/core runtime | grep -v 'playable_3d/src/core/eventStream.js:' || true)"
          if [ -n "$writers" ]; then
            printf '%s\n' "$writers"
            exit 1
          fi

      - name: Run protected foundation tests
        run: python run_tests.py
      - name: Verify local intake seal
        run: npm run verify:intake
      - name: Run headless regression gate
        run: npm run test:headless
      - name: Run full playable regression gate
        run: npm run test:playable
      - name: Verify generated public capability contract
        run: |
          node tools/generate-public-capability.mjs --check
          node --test intake-tests/public-capability-discovery.test.js
          node runtime/cli.js describe > /tmp/theme-park-describe.json
      - name: Prove playable distribution reproducibility
        run: |
          git add playable_3d/dist
          npm run build:playable
          git diff --exit-code -- playable_3d/dist
      - name: Verify preserved donor package
        run: npm run verify:donor
      - name: Reject whitespace and unresolved merge damage
        run: |
          git diff --check --cached
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Commit verified Steward integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m 'Integrate verified Steward growth with current safety contracts'
          git push origin HEAD:integration/theme-park-growth-consolidation-20260912
