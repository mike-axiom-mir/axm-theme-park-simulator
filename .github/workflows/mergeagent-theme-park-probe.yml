name: MergeAgent Theme Park Steward fixture probe

on:
  push:
    branches:
      - integration/theme-park-growth-consolidation-20260912

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/theme-park-growth-consolidation-20260912
          fetch-depth: 0
      - name: Merge Steward and locate failing fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff c33edbb476840ed1bdbdeed9c13c7812e3dafcf7
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != 'playable_3d/src/core/save.js' ]; then
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours playable_3d/src/core/save.js
            git add playable_3d/src/core/save.js
          fi
          grep -R -n -F --exclude-dir=.git 'safe operational actions round-trip through replay while unsafe ones fail closed' .
