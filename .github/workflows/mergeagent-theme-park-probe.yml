name: MergeAgent Theme Park Steward playable-test probe

on:
  push:
    branches:
      - integration/theme-park-growth-consolidation-20260912

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/theme-park-growth-consolidation-20260912
          fetch-depth: 0
      - name: Merge Steward and locate replay fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff c33edbb476840ed1bdbdeed9c13c7812e3dafcf7
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            [ "$conflicts" = 'playable_3d/src/core/save.js' ] || { printf '%s\n' "$conflicts"; exit 1; }
            git checkout --ours playable_3d/src/core/save.js
          fi
          echo '--- candidate lines ---'
          grep -R -n -E 'operational|unsafe|round.?trip|replay' playable_3d/tests intake-tests runtime-tests 2>/dev/null | head -300 || true
