name: MergeAgent Theme Park Steward playable-file probe

on:
  push:
    branches:
      - integration/theme-park-growth-consolidation-20260912

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/theme-park-growth-consolidation-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Merge Steward and run playable tests file-by-file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff c33edbb476840ed1bdbdeed9c13c7812e3dafcf7
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            [ "$conflicts" = 'playable_3d/src/core/save.js' ] || { printf '%s\n' "$conflicts"; exit 1; }
            git checkout --ours playable_3d/src/core/save.js
          fi
          python .axm-integration/steward_reconcile.py
          python - <<'PY'
          from pathlib import Path

          staff = Path('playable_3d/tests/staff-management.test.js')
          text = staff.read_text()
          old_decl = '  const staffRenderer = read("../src/render/staffAwareWorldRenderer.js");\n'
          new_decl = old_decl + '  const specialRenderer = read("../src/render/specialContentWorldRenderer.js");\n'
          if new_decl not in text:
              if old_decl not in text: raise SystemExit('staff renderer declaration missing')
              text = text.replace(old_decl, new_decl, 1)
          old_assert = '  assert.match(main, /staffAwareWorldRenderer/);\n'
          new_assert = '  assert.match(main, /contentStudioWorldRenderer/);\n  assert.match(specialRenderer, /staffAwareWorldRenderer/);\n'
          if new_assert not in text:
              if old_assert not in text: raise SystemExit('staff renderer assertion missing')
              text = text.replace(old_assert, new_assert, 1)
          staff.write_text(text)

          style = Path('playable_3d/tests/style-superpowers.test.js')
          text = style.read_text()
          old_decl = '  const finalStyle = read("../src/render/finalStyleWorldRenderer.js");\n'
          new_decl = old_decl + '  const legacyStyle = read("../src/render/legacyStyleUpgradeWorldRenderer.js");\n'
          if new_decl not in text:
              if old_decl not in text: raise SystemExit('style superpower legacy seam declaration missing')
              text = text.replace(old_decl, new_decl, 1)
          old_assert = '  assert.match(finalStyle, /gildedStyleWorldRenderer/);\n'
          new_assert = '  assert.match(finalStyle, /legacyStyleUpgradeWorldRenderer/);\n  assert.match(legacyStyle, /gildedStyleWorldRenderer/);\n'
          if new_assert not in text:
              if old_assert not in text: raise SystemExit('style superpower final seam assertion missing')
              text = text.replace(old_assert, new_assert, 1)
          style.write_text(text)
          PY
          echo '--- remaining direct event writers (only canonical eventStream expected) ---'
          grep -R -n -F 'eventLog.push' playable_3d/src/core runtime || true
          while IFS= read -r -d '' f; do
            echo "=== PLAYABLE_TEST_FILE:$f ==="
            if ! node --test "$f"; then
              echo "=== FAILING_PLAYABLE_FILE:$f ==="
              exit 1
            fi
          done < <(find playable_3d/tests -maxdepth 1 -type f -name '*.test.js' -print0 | sort -z)
