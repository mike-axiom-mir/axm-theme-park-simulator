name: MergeAgent Theme Park consolidation

on:
  push:
    branches:
      - integration/theme-park-growth-consolidation-20260912

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'MergeAgent integrate headless safety stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/theme-park-growth-consolidation-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Merge exact verified headless safety terminal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff 949682eeaa6a347c09900e32a3b1fd13b8bb7633
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf '%s\n' "$conflicts"
            expected=$'.axm-intake/LOCAL_PATCHES.json\n.axm-intake/SOURCE_ARCHIVES.json'
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected source conflict; refusing automatic resolution.'
              exit 1
            fi
            git checkout --ours .axm-intake/LOCAL_PATCHES.json .axm-intake/SOURCE_ARCHIVES.json
            git add .axm-intake/LOCAL_PATCHES.json .axm-intake/SOURCE_ARCHIVES.json
          fi
      - name: Rebuild combined browser projection
        run: npm run build:playable
      - name: Regenerate public capability evidence
        run: node tools/generate-public-capability.mjs --write
      - name: Recompute active intake evidence from combined tree
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          root = pathlib.Path('.')
          archives_path = root / '.axm-intake' / 'SOURCE_ARCHIVES.json'
          patches_path = root / '.axm-intake' / 'LOCAL_PATCHES.json'
          archives = json.loads(archives_path.read_text())
          entries = archives['lineages']['active']['topLevelEntries']
          raw = subprocess.check_output(['git','ls-files','-z','--',*entries])
          archives['lineages']['active']['sourceFiles'] = len([p for p in raw.split(b'\0') if p])
          archives_path.write_text(json.dumps(archives, indent=2) + '\n')

          old = json.loads(patches_path.read_text())
          old_map = {(p['index'], p['path']): p for p in old.get('patches', [])}
          refreshed = []
          for index in ['CHECKSUMS.sha256','PLAYABLE_3D_V0_4_6_CHECKSUMS.sha256']:
            for line in (root / index).read_text().splitlines():
              if not line.strip():
                continue
              m = re.match(r'^([0-9a-fA-F]{64})\s{2,}(.+)$', line)
              if not m:
                raise SystemExit(f'malformed checksum row: {index}: {line}')
              original, rel = m.group(1).lower(), m.group(2).replace('\\','/')
              target = root / rel
              if not target.exists():
                continue
              current = hashlib.sha256(target.read_bytes()).hexdigest()
              if current == original:
                continue
              prior = old_map.get((index, rel))
              reason = prior.get('reason') if prior else 'Consolidated verified growth-lane integration; current bytes are explicitly bound without rewriting the historical checksum index.'
              refreshed.append({
                'index': index,
                'path': rel,
                'originalSha256': original,
                'currentSha256': current,
                'reason': reason,
              })
          old['patches'] = refreshed
          patches_path.write_text(json.dumps(old, indent=2) + '\n')
          PY
          git add .axm-intake/LOCAL_PATCHES.json .axm-intake/SOURCE_ARCHIVES.json playable_3d/dist registry
      - name: Verify combined repository
        shell: bash
        run: |
          set -euo pipefail
          python run_tests.py
          npm run verify:intake
          npm run test:headless
          find truth-tests -maxdepth 1 -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0 | sort -z | xargs -0 node --test
          npm run test:playable
          npm run build:playable
          git diff --exit-code -- playable_3d/dist
          node tools/generate-public-capability.mjs --check
          python donor/AXM_THEME_PARK_SIM_COMPLETE_HANDOFF_v0_3_0/scripts/verify_package.py
      - name: Commit verified integration
        shell: bash
        run: |
          git add -A
          git commit -m 'MergeAgent integrate headless safety stack'
          git push origin HEAD:integration/theme-park-growth-consolidation-20260912
