name: Headless save read admission

on:
  pull_request:
    paths:
      - "runtime/file-save-store.js"
      - "truth-tests/file-save-read-admission.test.js"
      - ".github/workflows/headless-save-read-admission.yml"
      - "HEADLESS_CONSUMER.md"
  push:
    branches:
      - "automation/truth-sentinel-save-read-admission-20260910"

permissions:
  contents: read

concurrency:
  group: headless-save-read-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check save-store syntax
        run: node --check runtime/file-save-store.js

      - name: Run inherited headless/package tests
        run: npm run test:headless

      - name: Run save read-admission regressions
        run: node --test truth-tests/file-save-read-admission.test.js
