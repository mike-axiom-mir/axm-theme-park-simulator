name: MergeAgent final Theme Park growth

on:
  push:
    branches:
      - integration/theme-park-final-growth-20260912

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/theme-park-final-growth-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Transplant remaining growth onto current verified body
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 58d592c92df4748d988b6da6e1a25214adcf3b90 6cfa731f317da199fe39c8fae6b5446fa74698f7 5d1bda7467f15495d2daca32e3bbd8324083ef9a 35c546c3f6679126585cb58ee46e6b98c1600f81
          git diff 58d592c92df4748d988b6da6e1a25214adcf3b90 6cfa731f317da199fe39c8fae6b5446fa74698f7 -- \
            playable_3d/src/core/simulation.js \
            playable_3d/src/index.html \
            playable_3d/src/main.js \
            playable_3d/src/render/worldRenderer.js \
            playable_3d/src/styles.css \
            playable_3d/src/ui/interface.js \
            playable_3d/tests/simulation.test.js \
            playable_3d/tests/ui-contract.test.js > /tmp/placement.patch
          git apply --3way /tmp/placement.patch
          git show 5d1bda7467f15495d2daca32e3bbd8324083ef9a:experience-tests/speed-control-experience.spec.cjs > experience-tests/speed-control-experience.spec.cjs
          git show 35c546c3f6679126585cb58ee46e6b98c1600f81:experience-tests/park-gate-status-experience.spec.cjs > experience-tests/park-gate-status-experience.spec.cjs
          python - <<'PY'
          from pathlib import Path
          p = Path('experience-tests/speed-control-experience.spec.cjs')
          text = p.read_text().replace("const speeds = ['0', '1', '3', '8'];", "const speeds = ['0', '1', '2', '4'];")
          p.write_text(text)
          PY

      - name: Rebuild and reseal active intake evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run build:playable
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest_path = Path('.axm-intake/LOCAL_PATCHES.json')
          manifest = json.loads(manifest_path.read_text())
          reason = 'Verified current-body growth integration differs from the preserved archive byte while the original checksum index remains immutable.'
          patches = []
          for index_name in ('CHECKSUMS.sha256', 'PLAYABLE_3D_V0_4_6_CHECKSUMS.sha256'):
              index_path = Path(index_name)
              for line in index_path.read_text().splitlines():
                  if not line.strip():
                      continue
                  original, rel = line.split(None, 1)
                  rel = rel.strip()
                  target = Path(rel)
                  if not target.exists():
                      continue
                  current = digest(target)
                  if current != original.lower():
                      patches.append({
                          'index': index_name,
                          'path': rel.replace('\\', '/'),
                          'originalSha256': original.lower(),
                          'currentSha256': current,
                          'reason': reason
                      })
          manifest['patches'] = patches
          manifest['archiveChecksumIndexesModified'] = False
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          npm run verify:intake
          node tools/generate-public-capability.mjs --check

      - name: Run deterministic repository gates
        shell: bash
        run: |
          set -euo pipefail
          python run_tests.py
          npm run test:headless
          npm run test:playable
          npm run build:playable
          rm -rf /tmp/theme-park-dist
          cp -a playable_3d/dist /tmp/theme-park-dist
          npm run build:playable
          diff -qr /tmp/theme-park-dist playable_3d/dist
          python donor/AXM_THEME_PARK_SIM_COMPLETE_HANDOFF_v0_3_0/scripts/verify_package.py
          test "$(grep -R -l -F 'eventLog.push' playable_3d/src/core runtime | tr '\n' ' ')" = 'playable_3d/src/core/eventStream.js '

      - name: Run real browser control and save journeys
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install chromium
          mkdir -p experience-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 --directory playable_3d/dist >/tmp/theme-park-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .25
          done
          npx playwright test \
            experience-tests/speed-control-experience.spec.cjs \
            experience-tests/park-gate-status-experience.spec.cjs \
            experience-tests/save-import-experience.spec.cjs \
            --reporter=line --workers=1

      - name: Commit only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          git add .axm-intake/LOCAL_PATCHES.json playable_3d experience-tests/speed-control-experience.spec.cjs experience-tests/park-gate-status-experience.spec.cjs
          git diff --cached --check
          git commit -m 'Integrate placement truth and reachable park controls'
          git push origin HEAD:integration/theme-park-final-growth-20260912
